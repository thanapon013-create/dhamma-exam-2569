<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ค้นหาห้องสอบและที่นั่งสอบ</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="กรอกเลขประจำตัวนักเรียนเพื่อดูห้องสอบ เลขที่นั่งสอบ และสถานที่สอบ">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261116a">
</head>
<body class="theme-green">
  <main class="wrap">
    <header class="site">
      <h1 id="title">ค้นหาห้องสอบและที่นั่งสอบ</h1>
      <p class="venue" id="subtitle"></p>
      <p class="date" id="examDate" hidden></p>
      <p>กรอกเลขประจำตัวนักเรียนเพื่อดูห้องสอบของตนเอง</p>
    </header>

    <form class="card no-print" id="searchForm" novalidate>
      <label class="field" for="sid">เลขประจำตัวนักเรียน</label>
      <div class="search-row">
        <input type="text" id="sid" name="sid" inputmode="numeric" autocomplete="off"
               placeholder="เช่น 12345" aria-describedby="sidHint" required>
        <button type="submit" id="searchBtn">ค้นหา</button>
      </div>
      <p class="hint" id="sidHint">พิมพ์ตัวเลขไทยหรืออารบิกก็ได้</p>
    </form>

    <div class="result" id="result" aria-live="polite"></div>

    <section class="card rooms" id="rooms" aria-labelledby="roomsTitle" hidden>
      <h2 id="roomsTitle">ดูรายชื่อแต่ละห้องสอบ</h2>
      <div class="level-tabs no-print" id="levelTabs" role="group" aria-label="เลือกระดับ"></div>
      <div class="room-buttons no-print" id="roomButtons" role="group" aria-label="เลือกห้องสอบ"></div>
      <div id="roomList" aria-live="polite"></div>
    </section>

    <section class="card summary" id="summary" aria-labelledby="summaryTitle" hidden>
      <h2 id="summaryTitle">จำนวนผู้เข้าสอบ</h2>
      <div class="summary-grid" id="summaryGrid"></div>
      <h3 class="by-grade-title">แยกตามระดับชั้นเรียน</h3>
      <div class="by-grade-wrap"><table class="by-grade" id="byGrade"></table></div>
    </section>

    <footer class="site">
      <span id="updated"></span>
    </footer>
  </main>

  <script src="app.js?v=20261116a"></script>
  <script src="data.js?v=20261116a"></script>
  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('sid');
    const result = document.getElementById('result');
    const data = window.EXAM_DATA;

    if (!data || !data.students) {
      result.innerHTML = '<div class="alert error">ยังไม่มีข้อมูลห้องสอบ กรุณาให้ครูอัปโหลดข้อมูลผ่านหน้าผู้ดูแล</div>';
      form.querySelector('button').disabled = true;
    } else {
      if (data.meta?.title) { document.getElementById('title').textContent = data.meta.title; document.title = data.meta.title.replace(/\n/g, ' '); }
      if (data.meta?.subtitle) document.getElementById('subtitle').textContent = data.meta.subtitle;
      if (data.meta?.date) { const d = document.getElementById('examDate'); d.textContent = data.meta.date; d.hidden = false; }
      if (data.meta?.updated) document.getElementById('updated').textContent = 'ข้อมูล ณ ' + data.meta.updated;

      // Head count per exam level (e.title), in first-seen order, plus the total
      const counts = new Map();
      for (const s of Object.values(data.students))
        for (const e of s.exams) if (e.title) counts.set(e.title, (counts.get(e.title) || 0) + 1);
      if (counts.size) {
        const total = [...counts.values()].reduce((a, b) => a + b, 0);
        const fmt = n => n.toLocaleString('th-TH');
        document.getElementById('summaryGrid').innerHTML =
          [...counts].map(([t, n]) => `<div class="sum-item"><div class="l">${escapeHtml(t.replace('ธรรมศึกษา', ''))}</div><div class="n">${fmt(n)}</div><div class="u">คน</div></div>`).join('') +
          `<div class="sum-item total"><div class="l">รวมทั้งหมด</div><div class="n">${fmt(total)}</div><div class="u">คน</div></div>`;

        // Level × grade table: grade = "ม.4" part of the class "ม.4/6"
        const grid = new Map(), grades = new Set();
        for (const s of Object.values(data.students)) {
          const g = (s.cls || '').split('/')[0] || 'ไม่ระบุ';
          for (const e of s.exams) {
            if (!e.title) continue;
            grades.add(g);
            const row = grid.get(e.title) || grid.set(e.title, new Map()).get(e.title);
            row.set(g, (row.get(g) || 0) + 1);
          }
        }
        const cols = [...grades].sort((a, b) => a.localeCompare(b, 'th', { numeric: true }));
        const colTotal = g => [...grid.values()].reduce((a, r) => a + (r.get(g) || 0), 0);
        document.getElementById('byGrade').innerHTML = `
          <thead><tr><th scope="col">ระดับ</th>${cols.map(g => `<th scope="col">${escapeHtml(g)}</th>`).join('')}<th scope="col">รวม</th></tr></thead>
          <tbody>${[...counts.keys()].map(t => {
            const r = grid.get(t);
            return `<tr><th scope="row">${escapeHtml(t.replace('ธรรมศึกษา', ''))}</th>${cols.map(g => `<td>${fmt(r.get(g) || 0)}</td>`).join('')}<td class="sum">${fmt(counts.get(t))}</td></tr>`;
          }).join('')}</tbody>
          <tfoot><tr><th scope="row">รวม</th>${cols.map(g => `<td>${fmt(colTotal(g))}</td>`).join('')}<td class="sum">${fmt(total)}</td></tr></tfoot>`;
        document.getElementById('summary').hidden = false;
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (!data) return;
      const raw = input.value.trim();
      if (!raw) {
        result.innerHTML = '<div class="alert warn" role="alert">กรุณากรอกเลขประจำตัวนักเรียน</div>';
        input.focus();
        return;
      }
      const s = findStudent(data, raw);
      result.innerHTML = s
        ? renderStudent(s)
        : `<div class="alert error" role="alert">ไม่พบเลขประจำตัว <b>${escapeHtml(raw)}</b> ในบัญชีผู้เข้าสอบ กรุณาตรวจสอบเลขอีกครั้ง หรือติดต่อครูผู้รับผิดชอบ</div>`;
    });

    // ---------- Room browser: pick a level, then an exam room, to see everyone in it ----------
    if (data && data.students) {
      const levels = new Map(); // title -> Map(room -> {loc, people: []})
      for (const s of Object.values(data.students)) {
        for (const e of s.exams) {
          if (!e.title) continue;
          const rooms = levels.get(e.title) || levels.set(e.title, new Map()).get(e.title);
          const r = rooms.get(e.room) || rooms.set(e.room, { loc: e.loc, people: [] }).get(e.room);
          r.people.push({ seat: e.seat, name: s.name, cls: s.cls });
        }
      }
      const byNum = (a, b) => a.localeCompare(b, 'th', { numeric: true });
      const short = t => t.replace('ธรรมศึกษา', '');
      const tabs = document.getElementById('levelTabs');
      const btns = document.getElementById('roomButtons');
      const list = document.getElementById('roomList');

      function showLevel(title) {
        tabs.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.level === title));
        const rooms = [...levels.get(title)].sort((a, b) => byNum(a[0], b[0]));
        btns.innerHTML = rooms.map(([room, r]) => `
          <button type="button" class="room-btn" data-room="${escapeHtml(room)}" aria-pressed="false">
            <span class="rn">ห้องสอบ ${escapeHtml(room)}</span>
            <span class="rl">${escapeHtml(r.loc || '-')} · ${r.people.length} คน</span>
          </button>`).join('');
        btns.querySelectorAll('button').forEach(b => b.addEventListener('click', () => showRoom(title, b.dataset.room)));
        list.innerHTML = '<p class="hint">เลือกห้องสอบเพื่อดูรายชื่อทั้งห้อง</p>';
      }

      function showRoom(title, room) {
        btns.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.room === room));
        const r = levels.get(title).get(room);
        const people = [...r.people].sort((a, b) => byNum(a.seat, b.seat));
        list.innerHTML = `
          <div class="room-head">
            <div><span class="lv">${escapeHtml(short(title))}</span> ห้องสอบที่ ${escapeHtml(room)}</div>
            <div class="loc">${escapeHtml(r.loc || '-')} · ${people.length} คน</div>
          </div>
          <div class="table-wrap"><table class="room-table">
            <thead><tr><th>ที่</th><th>เลขที่สอบ</th><th>ชื่อ - นามสกุล</th><th>ห้อง</th></tr></thead>
            <tbody>${people.map((p, i) => `<tr><td>${i + 1}</td><td>${escapeHtml(p.seat)}</td><td class="nm">${escapeHtml(p.name)}</td><td>${escapeHtml(p.cls)}</td></tr>`).join('')}</tbody>
          </table></div>
          <button type="button" class="secondary no-print print-btn" onclick="window.print()">พิมพ์รายชื่อห้องนี้</button>`;
        list.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      if (levels.size) {
        tabs.innerHTML = [...levels.keys()].map(t =>
          `<button type="button" class="level-tab" data-level="${escapeHtml(t)}" aria-pressed="false">${escapeHtml(short(t))}</button>`).join('');
        tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => showLevel(b.dataset.level)));
        showLevel([...levels.keys()][0]);
        document.getElementById('rooms').hidden = false;
      }
    }
  </script>
</body>
</html>
